server {
    listen 80;

    # Upload-Größe: das Backend erlaubt 50 MB, hier leicht höher, damit
    # oversized Requests am Backend (mit einer sauberen 413-Meldung) landen
    # statt hier von nginx stumm abgelehnt zu werden.
    client_max_body_size 60M;

    # Security headers – gelten für alle Responses.
    # HSTS setzt Traefik zusätzlich am Edge; hier zur Belt-and-Suspenders.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: eigene Assets + API + inline styles für React/KaTeX.
    # 'unsafe-inline' für Styles ist praktisch unvermeidlich; für Scripts NICHT erlaubt.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
