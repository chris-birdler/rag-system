services:
  backend:
    build: .
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-large}
      - RERANKER=${RERANKER:-cohere}
    volumes:
      - chroma_data:/app/.chroma
      - ./data:/app/data
    networks:
      - internal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    depends_on:
      - backend
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rag-frontend.rule=Host(`papers.mccv.at`)"
      - "traefik.http.routers.rag-frontend.entrypoints=websecure"
      - "traefik.http.routers.rag-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.rag-frontend.loadbalancer.server.port=80"
    restart: unless-stopped

networks:
  web:
    external: true
  internal:
    driver: bridge

volumes:
  chroma_data:
